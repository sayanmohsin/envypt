[workspace]
resolver = "2"
members = [
    "crates/openv",
    "crates/openv-cli",
    "crates/openv-core",
    "crates/openv-crypto",
    "crates/openv-schema",
    "crates/openv-runtime",
    "crates/openv-output",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sayanmohsin/openv"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"

aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
age = { version = "0.11", features = ["armor"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
zeroize = "1"
