[workspace]
resolver = "2"
members = ["crates/envypt"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sayanmohsin/envypt"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"

aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
age = { version = "0.11", features = ["armor"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
zeroize = "1"
