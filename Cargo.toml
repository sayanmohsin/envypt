[workspace]
resolver = "2"
members = [
    "crates/openenvcrypt-cli",
    "crates/openenvcrypt-core",
    "crates/openenvcrypt-crypto",
    "crates/openenvcrypt-schema",
    "crates/openenvcrypt-runtime",
    "crates/openenvcrypt-output",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sayanmohsin/openenvcrypt"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
